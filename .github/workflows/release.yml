name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Validate TodoMVC .ferrite project
        run: cargo run --locked -p ferrite-cli -- check examples/todomvc

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ferrite-linux-x64.tar.gz
            bin: ferrite
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: ferrite-linux-arm64.tar.gz
            bin: ferrite
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ferrite-darwin-arm64.tar.gz
            bin: ferrite
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: ferrite-darwin-x64.tar.gz
            bin: ferrite
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ferrite-windows-x64.zip
            bin: ferrite.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install ARM64 cross-linker (Linux)
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build ferrite-cli release
        env:
          CARGO_TARGET_AARCH64_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p ferrite-cli
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.archive }} ${{ matrix.bin }}
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.bin }}" -DestinationPath "dist\${{ matrix.archive }}" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  package-extensions:
    name: Package Chrome & VS Code Extensions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Chrome MV3 extension & VS Code extension
        run: |
          mkdir -p dist
          (cd extension && zip -r ../dist/ferrite-e2e-chrome-extension.zip .)
          (cd vscode-ferrite && zip -r ../dist/ferrite-e2e-vscode-extension.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: dist/*.zip

  release:
    name: Publish GitHub Release
    needs: [build-binaries, package-extensions]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
